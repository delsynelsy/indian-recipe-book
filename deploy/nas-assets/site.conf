# nginx static server for recipes.mohammadasjad.com: the built output/ bundle
# shipped by deploy/publish.sh. add_header is repeated per location on purpose:
# a location with its own add_header drops every server-level one.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hero webps are not content-hashed, so cache for a day, not a year.
    location /images/ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html always revalidates so a publish shows up immediately.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }
}
