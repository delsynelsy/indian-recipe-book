# nginx static server for recipes.mohammadasjad.com: the built output/ bundle
# shipped by deploy/publish.sh. add_header is repeated per location on purpose:
# a location with its own add_header drops every server-level one.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hero webps are not content-hashed, so cache for a day, not a year.
    location /images/ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # API behind the same origin (first-party cookies): proxy to the
    # recipe-api compose service. Variable + resolver so nginx re-resolves
    # at request time (a recreated container gets a new IP); URI passed
    # intact because FastAPI declares /api/... routes.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://recipe-api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header X-Content-Type-Options "nosniff" always;
        # nginx-generated 502/504 (API down) must not be cached either (M10)
        add_header Cache-Control "no-store" always;
    }

    # index.html always revalidates so a publish shows up immediately.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }
}
