# recipe-book services on nas-bitcorp. Compose project dir on the NAS:
# /volume1/projects/recipe-book/deploy (runbook: README.md next to this file).
#
#   recipe-assets :8182 -> https://images.mohammadasjad.com   (image CDN)
#   recipe-site   :8183 -> https://recipes.mohammadasjad.com  (built output/)
#   recipe-api    (internal) -> recipes.mohammadasjad.com/api/ via site.conf proxy
#
# Both are published through the "Portfolio" Cloudflare tunnel; its cloudflared
# runs on the NAS with host networking, so ingress targets http://localhost:<port>.

services:
  recipe-assets:
    image: nginx:1.27-alpine
    container_name: recipe-assets
    restart: unless-stopped
    ports:
      - "8182:80"
    volumes:
      - /volume1/projects/recipe-book/assets:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  recipe-api:
    build: ./api
    container_name: recipe-api
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    volumes:
      - /volume1/projects/recipe-book/api-data:/data
    environment:
      - DB_PATH=/data/recipes.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  recipe-site:
    image: nginx:1.27-alpine
    container_name: recipe-site
    restart: unless-stopped
    ports:
      - "8183:80"
    volumes:
      - /volume1/projects/recipe-book/site:/usr/share/nginx/html:ro
      - ./site.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
